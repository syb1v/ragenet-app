[package]
name = "ragenet-desktop"
version = "0.1.0"
description = "RageNet VPN desktop shell"
license = "AGPL-3.0"
edition = "2021"

[lib]
name = "ragenet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
