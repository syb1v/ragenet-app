name: Build Android

on:
  workflow_dispatch:
  push:
    tags:
      - app-v*

permissions:
  contents: read

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android platforms
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read app version
        run: |
          VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building RageNet $VERSION"

      - name: Generate Android project
        run: pnpm --filter @ragenet/mobile exec expo prebuild --platform android --no-install

      - name: Build release APK (arm64)
        working-directory: apps/mobile/android
        env:
          GRADLE_OPTS: '-Xmx4g -Dorg.gradle.daemon=false'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --max-workers=2 \
            --no-daemon \
            --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "artifacts/RageNet-${APP_VERSION}-android-arm64.apk"
          cd artifacts
          sha256sum *.apk > SHA256SUMS-android.txt

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ragenet-android-apk
          path: artifacts
          if-no-files-found: error
          retention-days: 30
