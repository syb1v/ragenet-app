name: Build Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        type: choice
        options: [debug, release]
        default: debug
  push:
    tags:
      - app-v*

permissions:
  contents: write

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  BUILD_TYPE: ${{ github.event.inputs.build_type || (startsWith(github.ref, 'refs/tags/') && 'release' || 'debug') }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Show disk space
        run: df -h

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android platforms
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "platforms;android-37.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "build-tools;37.0.0"
          # AGP 9 resolves compileSdk 37 as platforms/android-37.
          ln -sfn "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37" 2>/dev/null || true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore libXray AAR
        uses: actions/cache@v4
        with:
          path: |
            apps/mobile/modules/ragenet-vpn/android/libs/libXray.aar
            apps/mobile/modules/ragenet-vpn/android/libs/libXray-classes.jar
          key: libxray-${{ runner.os }}-${{ hashFiles('native/versions.json') }}

      - name: Fetch libXray AAR (arm64, trimmed)
        run: |
          if [ ! -f apps/mobile/modules/ragenet-vpn/android/libs/libXray.aar ] || [ ! -f apps/mobile/modules/ragenet-vpn/android/libs/libXray-classes.jar ]; then
            LIBXRAY_ABI=arm64-v8a tools/fetch-libxray.sh
          fi
          df -h

      - name: Read app version
        run: |
          VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building RageNet $VERSION ($BUILD_TYPE, arm64)"

      - name: Generate Android project
        run: pnpm --filter @ragenet/mobile exec expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: apps/mobile/android
        env:
          GRADLE_OPTS: '-Xmx4g -Dorg.gradle.daemon=false'
        run: |
          chmod +x gradlew
          if [ "$BUILD_TYPE" = "release" ]; then
            TASK=assembleRelease
          else
            TASK=assembleDebug
          fi
          ./gradlew "$TASK" \
            -PreactNativeArchitectures=arm64-v8a \
            --build-cache \
            --max-workers=2 \
            --no-daemon \
            --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp "apps/mobile/android/app/build/outputs/apk/${BUILD_TYPE}/app-${BUILD_TYPE}.apk" \
            "artifacts/RageNet-${APP_VERSION}-android-arm64-${BUILD_TYPE}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ragenet-android-apk-${{ env.BUILD_TYPE }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          chmod +x scripts/publish-release.sh
          scripts/publish-release.sh "app-v${APP_VERSION}" "${APP_VERSION}" artifacts
