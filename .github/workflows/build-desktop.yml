name: Build desktop

on:
  workflow_dispatch:
  push:
    tags:
      - app-v*

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
          - name: macOS universal
            runner: macos-14
          - name: Linux x64
            runner: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Build Tauri app (macOS universal)
        if: runner.os == 'macOS'
        run: pnpm --filter @ragenet/desktop exec tauri build --target universal-apple-darwin

      - name: Build Tauri app
        if: runner.os != 'macOS'
        run: pnpm --filter @ragenet/desktop build

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: ragenet-desktop-${{ matrix.name }}
          path: apps/desktop/src-tauri/target/**/release/bundle
          if-no-files-found: error

      - name: Read app version
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: 'false'
        run: |
          mkdir -p release-assets
          # Publish installers only. Tauri bundles contain dozens of runtime
          # libraries and helper files; copying the whole bundle turns a release
          # into an unreadable dump of internal files.
          find apps/desktop/src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} release-assets/ \;
          chmod +x scripts/publish-release.sh
          scripts/publish-release.sh "app-v${APP_VERSION}" "${APP_VERSION}" release-assets
